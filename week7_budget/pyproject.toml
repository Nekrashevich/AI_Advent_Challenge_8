[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advent-week7-budget"
version = "0.1.0"
description = "Production-style AI pipelines for a personal expense tracker"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.9",
  "prompt_toolkit>=3.0",
  "pydantic>=2",
  "requests>=2.31",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
budget-pipeline = "budget_pipeline.console:main"
budget-pr-review = "budget_pipeline.review:main"

[tool.setuptools]
packages = ["budget_pipeline", "budget_pipeline.servers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

